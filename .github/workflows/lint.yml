name: PHP lint
# Every push: the plugin's PHP files parse on PHP 7.4 (the minimum) and 8.3.
on: [push, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find actuent-lawp -name '*.php' -print0 | xargs -0 -n1 php -l
